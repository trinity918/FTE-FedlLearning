description: >
  Milestone 6 stability check for FEMNIST CnnSmall + honest FedAvg at SGD lr 0.1,
  3 local epochs (second-best training loss in femnist_lr_sweep.yaml), run after
  lr 0.2 diverged in femnist_main (honest__fedavg/seed0, round 100).  Diagnostic
  only: seeds 200-202 are disjoint from the sweep seed (100) and the main-grid
  seeds (0-2), and the horizon equals the main grid's 100 rounds because the
  lr 0.2 instabilities appeared at rounds 73-100.  Judged on training losses and
  update norms only; the test set is not used.
base_config: fte_fl/configs/default.yaml
output_dir: results/runs/m6/femnist_stability_lr0.1
seeds: [200, 201, 202]
common:
  experiment.rounds: 100
  experiment.clients_per_round: 20
  experiment.lr: 0.1
  experiment.local_epochs: 3
  runtime.torch_threads: 1
  defense.name: fedavg
  defense.f: null
runs:
  fedavg_lr0.1_e3: {}
