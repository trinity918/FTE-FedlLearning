description: 'Milestone 6 main FEMNIST grid (plaintext protocol). CnnSmall, all 198 writers, 20 clients/round,
  100 rounds, SGD lr 0.2, 3 local epochs (selected by training loss in femnist_lr_sweep.yaml), torch_threads
  1. Attacked runs: 40 of 198 clients malicious (attack.seed 0, the same set for every seed and defense),
  stratified sampling with exactly 4 malicious per round; defense budget f = b = 4. Honest runs use uniform
  sampling.'
base_config: fte_fl/configs/default.yaml
output_dir: results/runs/m6/femnist_main
seeds:
- 0
- 1
- 2
common:
  experiment.rounds: 100
  experiment.clients_per_round: 20
  experiment.lr: 0.2
  experiment.local_epochs: 3
  runtime.torch_threads: 1
